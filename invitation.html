         <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3942.8236947880087!2d78.145819!3d8.802628499999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b03ef981a273663%3A0xf237e1185c924b7a!2sAlagar%20Mahal%20(Marriage%20Hall)!5e0!3m2!1sen!2sin!4v1778865323577!5m2!1sen!2sin"  style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
   
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const numberOfFlowers = 15; // Adjust number of falling flowers
            for (let i = 0; i < numberOfFlowers; i++) {
                createFlower();
            }
        });

        function createFlower() {
            const flower = document.createElement("div");
            flower.classList.add("flower");
            document.body.appendChild(flower);

            // Random position and animation duration
            let startPositionX = Math.random() * window.innerWidth;
            let duration = Math.random() * 5 + 5; // 5s to 10s fall duration
            let delay = Math.random() * 3; // Random delay

            flower.style.left = `${startPositionX}px`;
            flower.style.animationDuration = `${duration}s`;
            flower.style.animationDelay = `-${delay}s`;

            // Remove flower after falling
            setTimeout(() => {
                flower.remove();
                createFlower(); // Add a new one continuously
            }, duration * 1000);
        }

    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let audio = document.getElementById("bg-music");

            if (!audio) {
                audio = document.createElement("audio");
                audio.id = "bg-music";
                audio.src = "Assets/invi.mp3";  // Change to your actual file path
                audio.loop = true;
                audio.autoplay = true;

                // Restore previous playback position
                let savedTime = sessionStorage.getItem("audioTime");
                if (savedTime) {
                    audio.currentTime = parseFloat(savedTime);
                }

                document.body.appendChild(audio);

                // Try playing the audio (handle autoplay restrictions)
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Autoplay blocked, waiting for user interaction...");
                        document.addEventListener("click", () => {
                            audio.play();
                        }, { once: true });
                    });
                }

                // Save playback time before page unload
                window.addEventListener("beforeunload", () => {
                    sessionStorage.setItem("audioTime", audio.currentTime);
                });
            }
        });
    </script>


</body>

</html>
