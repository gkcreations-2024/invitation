<script>
    let maxPetals = 50; // Set a max number of petals allowed on the screen at once
    function createPetal() {
        const petalContainer = document.querySelector(".petal-container");

        // Check if petal count exceeds limit
        if (document.querySelectorAll(".petal").length >= maxPetals) {
            return; // Stop creating more petals if limit is reached
        }

        const petal = document.createElement("img");
        const petalImages = [
            "Assets/flower1.png",
            "Assets/flower2.png",
            "Assets/flower3.png",
            "Assets/flower4.png",
            "Assets/flower5.png",
            "Assets/flower6.png"
        ];
        
        petal.src = petalImages[Math.floor(Math.random() * petalImages.length)];
        petal.classList.add("petal");

        // Random position and size
        petal.style.left = `${Math.random() * 100}vw`;
        petal.style.width = `${30 + Math.random() * 20}px`; // Random size between 30px and 50px

        // Randomized animation duration
        let fallDuration = 3 + Math.random() * 3; // Between 3s and 6s
        petal.style.animation = `fall ${fallDuration}s linear`;

        petalContainer.appendChild(petal);

        // Remove petal after animation ends
        setTimeout(() => {
            petal.remove();
        }, fallDuration * 1000);
    }

    function startPetalFall() {
        setInterval(createPetal, 500); // Generate a petal every 500ms
    }
</script>

    <script>
        document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "F12" ||
                (event.ctrlKey && event.shiftKey && (event.key === "I" || event.key === "J" || event.key === "C")) ||
                (event.ctrlKey && event.key === "U")) {
                event.preventDefault();
            }
        });

        document.querySelectorAll("img").forEach(img => img.setAttribute("draggable", false));

        function updateCountdown() {
        const targetDate = new Date("May 29, 2026 05:00:00").getTime(); // Set target date and time
        function calculateTime() {
            const now = new Date().getTime();
            const diff = targetDate - now;
                if (diff <= 0) {
                    document.getElementById("countdown").style.display = "none";
                    document.getElementById("welcome-message").style.display = "block";
                    startPetalFall();
                    return;
                }
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
                document.getElementById("minutes").innerText = Math.floor((diff / (1000 * 60)) % 60);
                document.getElementById("seconds").innerText = Math.floor((diff / 1000) % 60);
            }
            calculateTime();
            setInterval(calculateTime, 1000);
        }
        document.addEventListener("DOMContentLoaded", updateCountdown);

        document.addEventListener("DOMContentLoaded", function () {
            let audio = document.getElementById("bg-music");

            if (!audio) {
                audio = document.createElement("audio");
                audio.id = "bg-music";
                audio.src = "Assets/hero.mp3"; // Update to correct file path
                audio.loop = true;
                audio.autoplay = true;
            }

            function playMusic() {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        console.log("Autoplay blocked, waiting for user interaction...");
                    });
                }
            }

            document.addEventListener("click", playMusic); // Play on any click
            document.querySelectorAll("a, button").forEach(btn => {
                btn.addEventListener("click", playMusic); // Play when clicking buttons or links
            });

            // Restore audio position on reload
            let savedTime = sessionStorage.getItem("audioTime");
            if (savedTime) {
                audio.currentTime = parseFloat(savedTime);
            }

            window.addEventListener("beforeunload", () => {
                sessionStorage.setItem("audioTime", audio.currentTime);
            });
        });
